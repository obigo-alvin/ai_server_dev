plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'obigo'
version = '0.0.1-SNAPSHOT'
description = 'spring boot obigo ai server'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	// LomBok
	compileOnly 'org.projectlombok:lombok:1.18.30' // Use the latest version
    annotationProcessor 'org.projectlombok:lombok:1.18.30' // Use the latest version
	testCompileOnly 'org.projectlombok:lombok:1.18.32'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.32'

	// Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0' // Use the latest stable version
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0' // For JSON parsing with Gson
	implementation 'com.squareup.retrofit2:converter-jackson:2.9.0'

    // OkHttp (Retrofit uses OkHttp for network requests)
    implementation 'com.squareup.okhttp3:okhttp:4.9.3' // Use the latest stable version
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3' // For logging network requests

	// Google Auth (서비스 계정 → OAuth2 Access Token)
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.39.1'
}

tasks.named('test') {
	useJUnitPlatform()
}
